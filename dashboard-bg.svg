<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
    <!-- Subtle Safari / Savannah themed geometry for light backgrounds -->
    <defs>
        <pattern id="mudcloth" width="100" height="100" patternUnits="userSpaceOnUse" patternTransform="scale(0.5)">
            <rect width="100" height="100" fill="#f9fafb"/>
            <!-- Triangle motif -->
            <path d="M 0 50 L 50 0 L 100 50 L 50 100 Z" fill="none" stroke="#e5e7eb" stroke-width="2"/>
            <path d="M 25 50 L 50 25 L 75 50 L 50 75 Z" fill="#e5e7eb" opacity="0.3"/>
            <!-- Dots -->
            <circle cx="50" cy="50" r="4" fill="#d1d5db" opacity="0.4"/>
            <circle cx="0" cy="0" r="4" fill="#d1d5db" opacity="0.4"/>
            <circle cx="100" cy="0" r="4" fill="#d1d5db" opacity="0.4"/>
            <circle cx="0" cy="100" r="4" fill="#d1d5db" opacity="0.4"/>
            <circle cx="100" cy="100" r="4" fill="#d1d5db" opacity="0.4"/>
            <!-- Zigzags -->
            <path d="M 0 25 L 25 0 M 75 0 L 100 25 M 0 75 L 25 100 M 75 100 L 100 75" stroke="#f3f4f6" stroke-width="6"/>
        </pattern>
    </defs>
    <rect width="100%" height="100%" fill="url(#mudcloth)"/>
</svg>
