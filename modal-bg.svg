<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
    <defs>
        <!-- Dark tribal luxury motif -->
        <pattern id="luxury-tribal" width="120" height="120" patternUnits="userSpaceOnUse">
            <rect width="120" height="120" fill="#1f2937"/>
            <g stroke="#ffffff" stroke-width="1" opacity="0.04" fill="none">
                <circle cx="60" cy="60" r="40"/>
                <circle cx="60" cy="60" r="30"/>
                <circle cx="60" cy="60" r="20"/>
                <path d="M 60 0 L 60 120 M 0 60 L 120 60"/>
                <path d="M 17 17 L 103 103 M 17 103 L 103 17"/>
            </g>
            <circle cx="60" cy="60" r="4" fill="#eab308" opacity="0.1"/>
        </pattern>
        <radialGradient id="glow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#374151" stop-opacity="1"/>
            <stop offset="100%" stop-color="#111827" stop-opacity="1"/>
        </radialGradient>
    </defs>
    <rect width="100%" height="100%" fill="url(#glow)"/>
    <rect width="100%" height="100%" fill="url(#luxury-tribal)"/>
</svg>
