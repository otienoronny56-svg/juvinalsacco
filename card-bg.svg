<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
    <defs>
        <pattern id="kente" width="80" height="80" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
            <rect width="80" height="80" fill="#2d1b4e"/>
            <path d="M0 40 L40 0 L80 40 L40 80 Z" fill="#432c7a" opacity="0.6"/>
            <rect x="20" y="20" width="40" height="40" fill="#e5a93c" opacity="0.1"/>
            <circle cx="40" cy="40" r="10" fill="#e84e1b" opacity="0.15"/>
        </pattern>
        <linearGradient id="purpleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.8"/>
            <stop offset="100%" stop-color="#2e1065" stop-opacity="0.95"/>
        </linearGradient>
    </defs>
    <rect width="100%" height="100%" fill="url(#purpleGradient)"/>
    <rect width="100%" height="100%" fill="url(#kente)"/>
    
    <!-- Abstract right-side silhouette motif -->
    <path d="M600 600 C 650 400, 500 200, 700 100 C 750 50, 800 150, 800 150 L800 600 Z" fill="#ffffff" opacity="0.05"/>
    <circle cx="750" cy="250" r="40" fill="#e5a93c" opacity="0.08"/>
    <circle cx="750" cy="250" r="25" fill="#111827" opacity="0.1"/>
</svg>
